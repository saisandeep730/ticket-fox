# Ticket Fox — free 24/7 deployment on a single small VM.
#
# Four containers:
#   caddy      — public entrypoint, automatic HTTPS (Let's Encrypt)
#   frontend   — Next.js standalone server
#   backend    — FastAPI + the polling worker (one process, as run.py intends)
#   wppconnect — WhatsApp Web gateway holding the linked session
#
# The `wppconnect` service name is kept for compatibility with the deploy
# scripts, but it now builds ./whatsapp-gateway: a Baileys-based server that
# implements the same REST contract in ~250 MB. The upstream
# wppconnect/wppconnect-server image unpacks to >4 GB and cannot fit on an
# 8 GB root volume.
#
# Caddy routes /api/* straight to the backend, so the browser never needs to know
# the backend's address and NEXT_PUBLIC_API_URL can stay empty.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. ticketfox.example.com)}
      # Optional second hostname served by the same site block (e.g. the old
      # domain during a migration). Defaults to DOMAIN when unset, so the site
      # list never ends in a dangling comma (Caddy rejects that). Set it to a
      # real hostname to keep a second domain alive, or to DOMAIN to serve only
      # the primary domain.
      DOMAIN_ALT: ${DOMAIN_ALT:-${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose: the browser calls same-origin /api, which Caddy proxies.
        NEXT_PUBLIC_API_URL: ""
        # Absolute origin used by the sitemap, robots.txt and the admin
        # dashboard's "return to app" links (the admin host cannot use "/").
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_ADMIN_EMAIL: ${NEXT_PUBLIC_ADMIN_EMAIL}
        NEXT_PUBLIC_ADMIN_UID: ${NEXT_PUBLIC_ADMIN_UID}
    restart: unless-stopped
    environment:
      # Used only by next.config.js rewrites; Caddy normally handles /api first.
      API_INTERNAL_URL: http://backend:8000
      # Runtime copy for server-rendered metadata (sitemap/robots are built at
      # build time, but this keeps any runtime read consistent).
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override the local-dev defaults from .env for container networking.
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      ALLOW_MOCK_AUTH: "false"
      DATABASE_URL: sqlite+aiosqlite:////data/ticket_fox_web.db
      WHATSAPP_API_URL: http://wppconnect:21465
      PUBLIC_APP_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - backend_data:/data
      # Firebase Admin service account. The target path must match
      # FIREBASE_CREDENTIALS_PATH in backend/.env (resolved relative to /app).
      # The file MUST exist before the first `up`, or Docker creates a
      # directory here and the backend dies with IsADirectoryError.
      - ./backend/ticketfox-web-firebase-adminsdk-fbsvc-a0fa60b1fd.json:/app/ticketfox-web-firebase-adminsdk-fbsvc-a0fa60b1fd.json:ro
    expose:
      - "8000"
    depends_on:
      - wppconnect

  wppconnect:
    build:
      context: ./whatsapp-gateway
    restart: unless-stopped
    environment:
      # SECRET_KEY is the *secret used to mint* a bearer token, not the token
      # itself. The gateway derives the bearer token as HMAC-SHA256(SECRET_KEY),
      # so the token is stable across restarts and can be stored once in
      # backend/.env as WHATSAPP_API_TOKEN.
      SECRET_KEY: ${WHATSAPP_SECRET_KEY:?set WHATSAPP_SECRET_KEY in .env}
      # Boot the default session immediately so a QR is available without an
      # explicit start-session call.
      START_ALL_SESSIONS: "true"
      DEFAULT_SESSION: ${WHATSAPP_SESSION:-ticketfox}
      AUTH_DIR: /data/auth
      LOG_LEVEL: warn
    volumes:
      # Baileys credential store — keeps the WhatsApp link across restarts.
      - wppconnect_auth:/data/auth
    expose:
      - "21465"

volumes:
  caddy_data:
  caddy_config:
  backend_data:
  wppconnect_auth:
